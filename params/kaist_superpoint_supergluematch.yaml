dataset:
  name: ComplexUrbanDatasetLoader
  root_path: /home/aki/Desktop/GitHub/Python-VO/Datasets/urban27-dongtan/
  #root_path: test_imgs
  sequence: 'urban27'
  start: 0
  scale_factor: 0.2
  is_kaist: True  # Set to True for Kaist dataset, False for TUM dataset


detector:
  name: SuperPointDetector
  descriptor_dim: 256
  nms_radius: 4
  keypoint_threshold: 0.005
  max_keypoints: -1
  remove_borders: 4
  cuda: 1

matcher:
  name: SuperGlueMatcher
  descriptor_dim: 256
  weights: "outdoor"
  sinkhorn_iterations: 100
  match_threshold: 0.2
  cuda: 1
