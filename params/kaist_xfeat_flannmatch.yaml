dataset:
  name: ComplexUrbanDatasetLoader
  root_path: /home/aki/Desktop/GitHub/Python-VO/Datasets/  
  sequence: 'urban27'
  start: 0
  scale_factor: 0.2
  is_kaist: True  # Set to True for Kaist dataset, False for TUM dataset


detector:
  name: XfeatDetector
  cuda: 1
  top_k: 4096
  detection_threshold: 0.05

matcher:
  name: FrameByFrameMatcher
  type: KNN
  KNN:
    HAMMING: False  # Use L2 bruteforce for float descriptors
    first_N: 300
  distance_ratio: 0.75

