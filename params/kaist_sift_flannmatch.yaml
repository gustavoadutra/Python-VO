dataset:
  name: ComplexUrbanDatasetLoader
  root_path: /home/aki/Desktop/GitHub/Python-VO/Datasets/  #root_path: test_imgs
  sequence: 'urban27'
  start: 0
  scale_factor: 0.2
  is_kaist: True  # Set to True for Kaist dataset, False for TUM dataset


detector:
  name: HandcraftDetector
  type: SIFT
  SIFT:
    nfeatures: 1000
    nOctaveLayers: 3
    contrastThreshold: 0.04
    edgeThreshold: 10
    sigma: 1.6

matcher:
  name: FrameByFrameMatcher
  type: FLANN
  FLANN:
    kdTrees: 5
    searchChecks: 50
  distance_ratio: 0.75
