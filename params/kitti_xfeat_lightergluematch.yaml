dataset:
  name: KITTILoader
  root_path: /home/aki/Desktop/GitHub/Python-VO/Datasets/KITTI/odometry
  #root_path: test_imgs
  sequence: '00'
  start: 0
  scale_factor: 0.75


detector:
  name: XfeatDetector
  type: XFEAT
  cuda: 1
  top_k: 1000
  detection_threshold: 0.1

matcher:
  name: LighterGlueMatcher
  type: LIGHT
  weights: /home/aki/Desktop/Python-VO/Detectors/accelerated_features/weights/xfeat-lighterglue.pt
  min_conf: 0.1
  cuda: 1

# Configurações de PnP
pnp:
  min_3d_points: 10
  min_parallax: 10
  min_track_rate: 10
  min_inliers: 0

  min_depth: 0.00001
  max_depth: 100.0
  min_absolute_scale: 0.1

  min_keypoints: 20
  min_distance_threshold: 5
  min_observations_threshold: 3

# Configurações de Bundle Adjustment e iSAM2
ba:
  pixel_noise: 1.5
  relinearize_threshold: 0.4
  relinearize_skip: 1
  # [Roll, Pitch, Yaw, X, Y, Z]
  noise_prior_sigmas: [0.05, 0.05, 0.05, 0.1, 0.1, 0.1]
  noise_odom_sigmas: [0.08, 0.08, 0.08, 0.15, 0.15, 0.15]
  noise_landmark_prior_sigma: 100.0
  # Lógica de inicialização de landmarks
  min_distance_threshold: 5
  min_observations_threshold: 10