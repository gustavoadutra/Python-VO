dataset:
  name: ComplexUrbanDatasetLoader
  root_path: /home/aki/Desktop/GitHub/Python-VO/Datasets/
  #root_path: test_imgs
  sequence: cusco_dataset_1
  start: 0
  is_robot: True
  use_direct_position: true
  scale: 200

detector:
  name: SuperPointDetector
  type: SUPERPOINT
  descriptor_dim: 256
  nms_radius: 4
  keypoint_threshold: 0.005
  max_keypoints: 1000
  remove_borders: 4
  cuda: 1

matcher:
  name: LightGlueMatcher
  type: LIGHT
  features: superpoint

  
# Configurações de PnP
pnp:
  min_3d_points: 10
  min_parallax: 10
  min_track_rate: 10
  min_inliers: 0

  min_depth: 0.00001
  max_depth: 100.0
  min_absolute_scale: 0.0001

  min_keypoints: 20
  min_distance_threshold: 0.01
  min_observations_threshold: 3

# Configurações de Bundle Adjustment e iSAM2
ba:
  pixel_noise: 1.5
  relinearize_threshold: 0.4
  relinearize_skip: 1
  # [Roll, Pitch, Yaw, X, Y, Z]
  noise_prior_sigmas: [0.05, 0.05, 0.05, 0.1, 0.1, 0.1]
  noise_odom_sigmas: [0.08, 0.08, 0.08, 0.15, 0.15, 0.15]
  noise_landmark_prior_sigma: 100.0
  # Lógica de inicialização de landmarks
  min_distance_threshold: 5
  min_observations_threshold: 10